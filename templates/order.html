<!DOCTYPE html>

{% if error %}
<p role="alert">{{ error }}</p>
{% endif %}
{% if order %}
<p role="status">
    Order saved. Requested period {{ order.target_period_s }} s,
    axle diameter {{ order.axle_diameter_mm }} mm.
</p>
{% endif %}
<form method="post" action="{{ url_for('create_order') }}">
    <fieldset>
        <legend>Pendulum requirements</legend>

        <p>
            <label for="target_period_s">Requested swing period (s)</label>
            <input id="target_period_s" name="target_period_s"
                   type="number" step="any" required>
        </p>

        <p>
            <label for="axle_diameter_mm">Axle diameter (mm)</label>
            <input id="axle_diameter_mm" name="axle_diameter_mm"
                   type="number" step="any" required>
        </p>
    </fieldset>

    <fieldset>
        <legend> Choose a filament </legend>
        <label for="base_spool_id">Filament for base</label>
        <select id="base_spool_id" name="base_spool_id" required>
            <option value="">Choose a filament</option>
            {% for spool_id, label in spools.items() %}
            <option value="{{ spool_id }}">{{ label }}</option>
            {% endfor %}
        </select>
    </fieldset>

    <button type="submit">Send order</button>
</form>
